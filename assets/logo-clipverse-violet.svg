<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <linearGradient id="cvGradViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="cvGlowViolet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Unique Clip Monogram Geometry -->
  <g transform="translate(6, 6)">
    <!-- Outer Hex Prism / Frame -->
    <path d="M24 4 L42 14 L42 34 L24 44 L6 34 L6 14 Z" stroke="url(#cvGradViolet)" stroke-width="2.5" fill="none" opacity="0.4"/>
    
    <!-- Central Dimensional V / Clip Play Waveform -->
    <path d="M15 16 L24 32 L33 16" stroke="url(#cvGradViolet)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#cvGlowViolet)"/>
    <circle cx="24" cy="18" r="3.5" fill="#c084fc" filter="url(#cvGlowViolet)"/>
    <circle cx="24" cy="32" r="2.5" fill="#a855f7"/>
  </g>
  
  <!-- Typographic Wordmark -->
  <g transform="translate(60, 39)">
    <text font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="24" letter-spacing="1.5" fill="#ffffff">
      CLIP<tspan fill="url(#cvGradViolet)">VERSE</tspan>
    </text>
    <text x="116" y="-14" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="8" letter-spacing="1.5" fill="#10b981">
      [AI-SHIELD]
    </text>
  </g>
</svg>
