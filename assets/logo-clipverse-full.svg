<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="fullPrismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="fullChevronGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <radialGradient id="fullNodeGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="fullGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left Emblem Group (scaled and positioned) -->
  <g transform="translate(16, 12)">
    <!-- Ambient glow -->
    <circle cx="48" cy="48" r="44" fill="#a855f7" opacity="0.12"/>
    
    <!-- Outer Hex Prism (Favicon Polygon) -->
    <path d="M48 8 L84 28 L84 68 L48 88 L12 68 L12 28 Z" 
          stroke="url(#fullPrismGrad)" 
          stroke-width="3" 
          stroke-linejoin="round"
          fill="none" 
          opacity="0.85"
          filter="url(#fullGlow)"/>

    <!-- Central Kinetic Chevron -->
    <path d="M30 35 L48 62 L66 35" 
          stroke="url(#fullChevronGrad)" 
          stroke-width="6" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#fullGlow)"/>
    <path d="M30 35 L48 62 L66 35" 
          stroke="#ffffff" 
          stroke-width="1.8" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.9"/>

    <!-- Emerald AI Optic Node -->
    <circle cx="48" cy="32" r="5.5" fill="url(#fullNodeGrad)" filter="url(#fullGlow)"/>
    <circle cx="46.5" cy="30.5" r="1.8" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Typography: Wordmark + Tagline -->
  <g transform="translate(136, 68)">
    <text font-family="'Lexend', 'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="38" letter-spacing="1.5" fill="#ffffff">
      CLIP<tspan fill="url(#textGrad)">VERSE</tspan>
    </text>
  </g>
  
  <g transform="translate(138, 92)">
    <text font-family="'JetBrains Mono', monospace" font-weight="600" font-size="11" letter-spacing="4" fill="#94a3b8" opacity="0.85">
      AI VIDEO AGENCY
    </text>
    <!-- Emerald Status Pip -->
    <circle cx="178" cy="-3" r="3" fill="#10b981" filter="url(#fullGlow)"/>
  </g>
</svg>
